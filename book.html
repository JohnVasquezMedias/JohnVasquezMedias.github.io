<style>

/* BACKGROUND */

body{

margin:0;
font-family:'Montserrat',sans-serif;

background-image:url("violinbg.jpg");
background-size:cover;
background-position:center;

min-height:100vh;

}


/* FORM BOX */

.book-box{

width:520px;

margin:160px auto;

background:#3a2f2b;   /* DARK BROWN */

padding:60px;

border-radius:35px;

color:white;

}


/* TITLE */

.book-title{

text-align:center;

font-family:'Great Vibes';

font-size:60px;

margin-bottom:40px;

}


/* INPUTS */

.book-box input,
.book-box textarea,
.book-box select{

width:100%;

background:transparent;

border:none;

border-bottom:1px solid white;

margin-bottom:28px;

padding:10px 0;

color:white;

font-size:14px;

}


/* DROPDOWN FIX */

.book-box select option{
color:black;
}


/* NAME ROW */

.name-row{

display:flex;

gap:25px;

}


/* MESSAGE */

textarea{

height:160px;
resize:none;

}


/* BUTTON */

.book-button{

display:block;

margin:auto;

background:#9c7759;

border:none;

color:white;

padding:14px 40px;

margin-top:20px;

cursor:pointer;

}
